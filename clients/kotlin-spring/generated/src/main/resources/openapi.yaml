components:
  schemas:
    AbilityChange:
      example:
        version_group: ""
        effect_entries:
        - effect: effect
          language: ""
        - effect: effect
          language: ""
      properties:
        version_group:
          allOf:
          - $ref: "#/components/schemas/VersionGroupSummary"
          description: The version group in which the previous effect of this ability
            originated.
        effect_entries:
          description: The previous effect of this ability listed in different languages.
          items:
            $ref: "#/components/schemas/AbilityChangeEffectText"
          readOnly: true
          type: array
          default: null
      required:
      - effect_entries
      - version_group
    AbilityChangeEffectText:
      example:
        effect: effect
        language: ""
      properties:
        effect:
          description: The localized effect text for an API resource in a specific
            language.
          maxLength: 6000
          type: string
        language:
          allOf:
          - $ref: "#/components/schemas/LanguageSummary"
          description: The language this effect is in.
      required:
      - effect
      - language
    AbilityDetail:
      example:
        id: 0
        name: name
        is_main_series: true
        generation: ""
        names:
        - name: name
          language: ""
        - name: name
          language: ""
        effect_entries:
        - effect: effect
          short_effect: short_effect
          language: ""
        - effect: effect
          short_effect: short_effect
          language: ""
        effect_changes:
        - version_group: ""
          effect_entries:
          - effect: effect
            language: ""
          - effect: effect
            language: ""
        - version_group: ""
          effect_entries:
          - effect: effect
            language: ""
          - effect: effect
            language: ""
        flavor_text_entries:
        - flavor_text: flavor_text
          language: ""
          version_group: ""
        - flavor_text: flavor_text
          language: ""
          version_group: ""
        pokemon:
        - is_hidden: true
          slot: 441289069
          pokemon: ""
        - is_hidden: true
          slot: 441289069
          pokemon: ""
      properties:
        id:
          description: The identifier for this resource.
          readOnly: true
          type: integer
        name:
          description: The name for this resource.
          maxLength: 200
          type: string
        is_main_series:
          description: Whether or not this ability originated in the main series of
            the video games.
          type: boolean
        generation:
          allOf:
          - $ref: "#/components/schemas/GenerationSummary"
          description: The generation this ability originated in.
        names:
          description: The name of this resource listed in different languages.
          items:
            $ref: "#/components/schemas/AbilityName"
          readOnly: true
          type: array
          default: null
        effect_entries:
          description: The effect of this ability listed in different languages.
          items:
            $ref: "#/components/schemas/AbilityEffectText"
          readOnly: true
          type: array
          default: null
        effect_changes:
          description: The list of previous effects this ability has had across version
            groups.
          items:
            $ref: "#/components/schemas/AbilityChange"
          readOnly: true
          type: array
          default: null
        flavor_text_entries:
          description: The flavor text of this ability listed in different languages.
          items:
            $ref: "#/components/schemas/AbilityFlavorText"
          readOnly: true
          type: array
          default: null
        pokemon:
          description: A list of Pokémon that could potentially have this ability.
          items:
            $ref: "#/components/schemas/AbilityPokemonDetail"
          readOnly: true
          type: array
          default: null
      required:
      - effect_changes
      - effect_entries
      - flavor_text_entries
      - generation
      - id
      - name
      - names
      - pokemon
    AbilityEffectText:
      example:
        effect: effect
        short_effect: short_effect
        language: ""
      properties:
        effect:
          description: The localized effect text for an API resource in a specific
            language.
          maxLength: 6000
          type: string
        short_effect:
          description: The localized effect text in brief.
          maxLength: 300
          type: string
        language:
          allOf:
          - $ref: "#/components/schemas/LanguageSummary"
          description: The language this effect is in.
      required:
      - effect
      - language
      - short_effect
    AbilityFlavorText:
      example:
        flavor_text: flavor_text
        language: ""
        version_group: ""
      properties:
        flavor_text:
          description: The localized name for an API resource in a specific language.
          type: string
        language:
          allOf:
          - $ref: "#/components/schemas/LanguageSummary"
          description: The language this text resource is in.
        version_group:
          allOf:
          - $ref: "#/components/schemas/VersionGroupSummary"
          description: The version group that uses this flavor text.
      required:
      - flavor_text
      - language
      - version_group
    AbilityName:
      example:
