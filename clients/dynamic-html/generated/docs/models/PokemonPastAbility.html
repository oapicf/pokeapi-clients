
<h2>PokemonPastAbility</h2>
<ul class="parameter">
  <li class="param-required-true">abilities : List
    <br/>The abilities the referenced pokémon had up to and including the listed generation. If null, the slot was previously empty.
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-true">generation : GenerationSummary
    <br/>The last generation in which the referenced pokémon had the listed abilities.
  </li>
</ul>
