
<h2>ItemFlavorText</h2>
<ul class="parameter">
  <li class="param-required-true">text : String
    <br/>The localized flavor text for an API resource in a specific language.
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-true">versionUnderscoregroup : VersionGroupSummary
    <br/>The version group which uses this flavor text.
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-true">language : LanguageSummary
    <br/>The language this name is in.
  </li>
</ul>
