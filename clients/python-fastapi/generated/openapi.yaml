components:
  schemas:
    AbilityChange:
      example:
        version_group: ""
        effect_entries:
        - effect: effect
          language: ""
        - effect: effect
          language: ""
      properties:
        version_group:
          allOf:
          - $ref: "#/components/schemas/VersionGroupSummary"
          description: The version group in which the previous effect of this ability
            originated.
          title: version_group
        effect_entries:
          description: The previous effect of this ability listed in different languages.
          items:
            $ref: "#/components/schemas/AbilityChangeEffectText"
          readOnly: true
          title: effect_entries
          type: array
          default: null
      required:
      - effect_entries
      - version_group
      title: AbilityChange
    AbilityChangeEffectText:
      example:
        effect: effect
        language: ""
      properties:
        effect:
          description: The localized effect text for an API resource in a specific
            language.
          maxLength: 6000
          title: effect
          type: string
        language:
          allOf:
          - $ref: "#/components/schemas/LanguageSummary"
          description: The language this effect is in.
          title: language
      required:
      - effect
      - language
      title: AbilityChangeEffectText
    AbilityDetail:
      example:
        id: 0
        name: name
        is_main_series: true
        generation: ""
        names:
        - name: name
          language: ""
        - name: name
          language: ""
        effect_entries:
        - effect: effect
          short_effect: short_effect
          language: ""
        - effect: effect
          short_effect: short_effect
          language: ""
        effect_changes:
        - version_group: ""
          effect_entries:
          - effect: effect
            language: ""
          - effect: effect
            language: ""
        - version_group: ""
          effect_entries:
          - effect: effect
            language: ""
          - effect: effect
            language: ""
        flavor_text_entries:
        - flavor_text: flavor_text
          language: ""
          version_group: ""
        - flavor_text: flavor_text
          language: ""
          version_group: ""
        pokemon:
        - is_hidden: true
          slot: 441289069
          pokemon: ""
        - is_hidden: true
          slot: 441289069
          pokemon: ""
      properties:
        id:
          description: The identifier for this resource.
          readOnly: true
          title: id
          type: integer
        name:
          description: The name for this resource.
          maxLength: 200
          title: name
          type: string
        is_main_series:
          description: Whether or not this ability originated in the main series of
            the video games.
          title: is_main_series
          type: boolean
        generation:
          allOf:
          - $ref: "#/components/schemas/GenerationSummary"
          description: The generation this ability originated in.
          title: generation
        names:
          description: The name of this resource listed in different languages.
          items:
            $ref: "#/components/schemas/AbilityName"
          readOnly: true
          title: names
          type: array
          default: null
        effect_entries:
          description: The effect of this ability listed in different languages.
          items:
            $ref: "#/components/schemas/AbilityEffectText"
          readOnly: true
          title: effect_entries
          type: array
          default: null
        effect_changes:
          description: The list of previous effects this ability has had across version
            groups.
          items:
            $ref: "#/components/schemas/AbilityChange"
          readOnly: true
          title: effect_changes
          type: array
          default: null
        flavor_text_entries:
          description: The flavor text of this ability listed in different languages.
          items:
            $ref: "#/components/schemas/AbilityFlavorText"
          readOnly: true
          title: flavor_text_entries
          type: array
          default: null
        pokemon:
          description: A list of Pokémon that could potentially have this ability.
          items:
            $ref: "#/components/schemas/AbilityPokemonDetail"
          readOnly: true
          title: pokemon
          type: array
          default: null
